# GitHub Actions: Windows exe 云端打包
#
# 触发: push 到 main(代码/配置/打包文件变更)、手动、tag(v*)发布
# 产物: Artifact "ylzt-windows-portable"(运行页底部下载,需登录 GitHub)
#
# 完整性由 scripts/build.py 的 verify_dist() 保证:
# exe 与全部资源(config/profiles/templates)缺一即打包失败。

name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "ylzt.spec"
      - "config/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[windows,dev]" pyinstaller
        shell: cmd

      - name: 运行全量测试
        continue-on-error: true
        run: .venv\Scripts\python -m pytest -q --tb=line -p no:cacheprovider

      - name: PyInstaller 打包(直接输出到日志)
        run: .venv\Scripts\python scripts\build.py --no-tests

      - name: 压缩产物
        run: Compress-Archive -Path dist\ylzt\* -DestinationPath ylzt-windows-portable.zip
        shell: pwsh

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ylzt-windows-portable
          path: ylzt-windows-portable.zip
          retention-days: 30

      - name: 发布版附加产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ylzt-windows-portable.zip
