# GitHub Actions: Windows exe 云端打包
#
# 触发:
# - push 到 main 且涉及代码/配置/打包文件变更
# - 手动(workflow_dispatch)
# - tag(v*)发布
#
# 产物:
# - dist/ylzt/ 打包目录 → zip 压缩为 Artifact "ylzt-windows-portable"
#   在 Actions 运行页底部下载
#
# 流程与 scripts/build_windows.bat 一致:
# 建 venv → 装依赖(windows + dev + pyinstaller)→ 全量测试 → build.py 打包

name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "ylzt.spec"
      - "config/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[windows,dev]" pyinstaller
        shell: cmd

      # 测试失败不阻断打包(先出 exe),结果写入 Step Summary 公开可读
      - name: 运行全量测试
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          .venv\Scripts\python -m pytest -q --tb=short -p no:cacheprovider 2>&1 |
            Tee-Object -Variable out | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "PYTEST_EXIT=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: PyInstaller 打包(输出存文件)
        if: always()
        shell: cmd
        run: .venv\Scripts\python scripts\build.py --no-tests > build_output.log 2>&1
        continue-on-error: true

      - name: 上传打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build_output.log
          retention-days: 7

      - name: 打包失败则终止
        if: always()
        shell: pwsh
        run: |
          $log = Get-Content build_output.log -Raw
          $log | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if (Test-Path "dist\ylzt\ylzt.exe") {
            "✅ ylzt.exe 已生成" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "❌ ylzt.exe 未生成" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: 压缩产物
        if: always()
        run: Compress-Archive -Path dist\ylzt\* -DestinationPath ylzt-windows-portable.zip
        shell: pwsh

      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ylzt-windows-portable
          path: ylzt-windows-portable.zip
          retention-days: 30

      - name: 发布版附加产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ylzt-windows-portable.zip

      - name: 汇总(测试失败则任务标红)
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.tests.outcome }}" -ne "success") {
            "### ⚠ 存在测试失败(不影响本页 Artifact 下载)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
